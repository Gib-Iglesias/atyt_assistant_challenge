name: att-assistant

services:
  django:
    build: ./backend_django
    env_file: .env
    environment:
      DJANGO_SERVICE: "1"
    volumes:
      - appdata:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/.ready"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 10s
    restart: unless-stopped

  api:
    build: ./service_ai
    env_file: .env
    volumes:
      - appdata:/data
    ports:
      - "8001:8001"
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  appdata:
