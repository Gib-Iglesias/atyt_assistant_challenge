# nginx sirve el frontend estatico y hace de proxy inverso hacia los dos
# backends, de modo que todo queda en el mismo origen y no hace falta CORS.
# El bloque de streaming desactiva el buffering: sin esto, nginx acumularia los
# eventos SSE y el usuario veria la respuesta de golpe en vez de token a token.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Autenticacion: la emite Django.
    location /api/auth/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
    }

    # Chat en streaming: lo sirve FastAPI.
    location /api/ {
        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # SPA: cualquier ruta desconocida devuelve el index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
